# Weekly dependency update PRs (docs/development.md §15.6). Minor and patch updates are
# grouped into one PR per ecosystem so they can be reviewed together; majors come one by one
# because they can break things. CI runs on every one of them.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces are handled by the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
