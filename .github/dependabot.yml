# Weekly dependency update PRs (docs/development.md §15.6). Minor and patch updates are
# grouped into one PR per ecosystem so they can be reviewed together; majors come one by one
# because they can break things. CI runs on every one of them.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces are handled by the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Prisma CLI and client must be the same version: updated apart, `prisma generate`
      # fails (it bumped only @prisma/client to 7 in #34). Listed first, so it wins.
      prisma:
        patterns: ['prisma', '@prisma/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma majors change the generator, config and connection setup: a planned
      # upgrade with code changes, not a version bump.
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      # Node's types must match the Node version that runs the code (22, see the docker
      # rule below); newer majors describe APIs Node 22 doesn't have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors are a deliberate upgrade, done together with .nvmrc and local
      # development, and only to an even-numbered (long-term support) release. Dependabot
      # would propose every major, including short-lived odd ones (it opened 22 -> 25).
      - dependency-name: node
        update-types: ['version-update:semver-major']
