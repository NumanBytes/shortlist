packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  msgpackr-extract: false # optional BullMQ speed-up; pure-JS fallback is fine at our volume
  prisma: true
minimumReleaseAgeExclude:
  - nodemailer@10.1.1
overrides:
  # GHSA-ggr8-5vv4-36mx: Prisma's config loader pins 7.1.5 even in its latest release. It
  # only calls deepmerge(), which 8.x keeps. Drop this once Prisma moves to >= 8.
  deepmerge-ts: ^8.0.2
  # GHSA-68fv-2mgg-jv7q (dev-only, via Vite and jsdom): fixed in 1.2.2. Drop once they require it.
  source-map-js: ^1.2.2
